# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Workflow de Integração Contínua

# toda vez que um pull request foi fetio, uma ação sera executada
on: #aonde esse workflow vai ser ativado (trigger)
  pull_request:
    branches: [ "main" ]
# ações que serão executadas quando o nosso workflow ser chamado
jobs:
  testes:
    # em qual tipo de máquina esse workflow será executado
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn test
